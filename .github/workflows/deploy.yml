name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built-in token is all this needs: no repository secrets.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight one finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19, during the event run-up.
    runs-on: ubuntu-24.04
    env:
      # Project site: https://<owner>.github.io/<repo>/. With a custom domain served from the
      # root, set the repository variable BASE_HREF to "/" (Settings > Secrets and variables > Actions > Variables).
      BASE_HREF: ${{ vars.BASE_HREF || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx ng test --watch=false

      # Also writes 404.html (postbuild) so deep links load the app on Pages.
      - run: npm run build -- --base-href "$BASE_HREF"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/relational-devdays/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
